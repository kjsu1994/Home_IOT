server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: home-iot-server
  datasource:
    url: jdbc:h2:mem:homeiot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:homeiot-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:homeiot-google-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/api/login/oauth2/code/{registrationId}}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:homeiot-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:homeiot-naver-client-secret}
            redirect-uri: ${NAVER_REDIRECT_URI:{baseUrl}/api/login/oauth2/code/{registrationId}}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            client-name: Naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

mail:
  address:
    master: ${MAIL_ADDRESS_MASTER:no-reply@homeiot.local}

signup:
  email-verification:
    expire-minutes: ${SIGNUP_EMAIL_VERIFICATION_EXPIRE_MINUTES:30}
    request:
      cooldown-seconds: ${SIGNUP_EMAIL_VERIFICATION_REQUEST_COOLDOWN_SECONDS:60}
      max-per-email-per-hour: ${SIGNUP_EMAIL_VERIFICATION_REQUEST_MAX_PER_EMAIL_PER_HOUR:5}
      max-per-ip-per-hour: ${SIGNUP_EMAIL_VERIFICATION_REQUEST_MAX_PER_IP_PER_HOUR:20}
    confirm:
      max-failures: ${SIGNUP_EMAIL_VERIFICATION_CONFIRM_MAX_FAILURES:5}

password-reset:
  expire-minutes: ${PASSWORD_RESET_EXPIRE_MINUTES:30}

jwt:
  secret-key: ${JWT_SECRET_KEY:home-iot-dev-secret-key-change-me-at-least-32-bytes}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refresh-token-expiration-minutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:10080}

mqtt:
  broker-url: tcp://localhost:1883
  client-id: home-iot-server
  username: ''
  password: ''
  command-mode: mock

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088}
  device-api-key: ${APP_DEVICE_API_KEY:}
  master-emails: ${APP_MASTER_EMAILS:}
  oauth2-success-redirect-path: ${APP_OAUTH2_SUCCESS_REDIRECT_PATH:/iot/}
  camera:
    recording-root: ${APP_CAMERA_RECORDING_ROOT:camera-recordings}

