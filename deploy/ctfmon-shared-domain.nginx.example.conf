# Example reverse proxy rules for serving Home_IOT beside the existing ctfmon site.
# This file is documentation/template only. Do not replace the production ctfmon
# proxy config without reviewing existing ctfmon routes first.

# Existing ctfmon routes stay owned by ctfmon:
#   /      -> ctfmon frontend
#   /api   -> ctfmon backend
#   /ws    -> ctfmon websocket, if present

# Home_IOT frontend. Build frontend with:
#   VITE_BASE_PATH=/iot/
#   VITE_API_BASE_PATH=/iot-api
location /iot/ {
    proxy_pass http://home-iot-frontend:80/iot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Home_IOT API. Public /iot-api/* is rewritten to backend /api/*.
# Do not use public /api for Home_IOT because ctfmon owns that path.
location /iot-api/ {
    proxy_pass http://home-iot-backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
